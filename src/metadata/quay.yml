# PURL configuration for http://purl.obolibrary.org/obo/quay

idspace: QUAY
base_url: /obo/quay

products:
- quay.owl: https://raw.githubusercontent.com/ThHanke/quay/main/quay.owl
- quay.obo: https://raw.githubusercontent.com/ThHanke/quay/main/quay.obo

term_browser: ontobee
example_terms:
- QUAY_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/ThHanke/quay/v

- prefix: /tracker/
  replacement: https://github.com/ThHanke/quay/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/QUAY?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/ThHanke/quay/main/
