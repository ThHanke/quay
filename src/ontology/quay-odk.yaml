id: quay
title: "QUAY: Qualified Usage, Access and Yield"
github_org: ThHanke
repo: quay
git_main_branch: main
license: "CC-BY-4.0"
description: >
  A DCAT Profile for Data Access, Storage and Authorization Metadata.

edit_format: owl
edit_ontology_file: "src/ontology/quay-edit.owl"

uribase: "https://w3id.org"
uribase_suffix: "quay"
preferredPrefix: "QUAY"

namespaces:
  - "https://w3id.org/quay/"

use_templates: false
use_context: true

import_group:
  products:
    - id: dcat
      title: "DCAT - Data Catalog Vocabulary"
      mirror_from: "https://www.w3.org/ns/dcat3.ttl"
      module_type: slme
      base_iris:
        - https://www.w3.org/ns/dcat#
    - id: odrl
      title: "ODRL Information Model"
      mirror_from: "https://www.w3.org/ns/odrl/2/ODRL22.ttl"
      module_type: custom

components:
  products: []

primary_release: full
release_artefacts:
  - base
  - full
export_formats:
  - owl
  - ttl
  - json

ci: []

## Human-readable IRIs used (no numeric ID allocation needed).
## Convention: Classes=PascalCase, Properties=camelCase, derived from rdfs:label.
## Enforced by SPARQL checks: quay-label-required.sparql, quay-iri-label-match.sparql
